# ============================================
# Perfil activo
# ============================================
spring.profiles.active=dev

# ============================================
# Configuracion general de la aplicacion
# ============================================
spring.application.name=contenidos-service

# ============================================
# Configuracion del servidor embebido
# ============================================
server.port=${SERVER_PORT}
server.servlet.context-path=/
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Inclusion de detalles en respuestas de error
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# Configuracion de base de datos PostgreSQL
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# Configuracion de JPA e Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Configuracion del sistema de datos iniciales
# ============================================
seed.enabled=${SEED_ENABLED}
seed.user-data.enabled=${SEED_USER_DATA_ENABLED}
seed.artist-interactions.enabled=${SEED_ARTIST_INTERACTIONS_ENABLED}

# ============================================
# Configuracion de seguridad JWT
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# URL base del frontend para enlaces
app.frontend.url=${FRONTEND_URL}

# ============================================
# Configuracion de Cloudinary para almacenamiento multimedia
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER}

# ============================================
# Limites de tamano para archivos multimedia
# ============================================
# Tamano maximo para archivos de audio: 50MB
cloudinary.audio.max-size=${CLOUDINARY_AUDIO_MAX_SIZE}

# Tamaño maximo para archivos de imagen: 5MB
cloudinary.image.max-size=${CLOUDINARY_IMAGE_MAX_SIZE}

# ============================================
# Configuracion de carga de archivos multipart
# ============================================
spring.servlet.multipart.max-file-size=52MB
spring.servlet.multipart.max-request-size=52MB

# ============================================
# URLs de comunicacion entre microservicios
# ============================================
microservices.usuarios.url=${USUARIOS_SERVICE_URL}
microservices.contenidos.url=${CONTENIDOS_SERVICE_URL}
microservices.recomendaciones.url=${RECOMENDACIONES_SERVICE_URL}
microservices.service-token=${SERVICE_TOKEN}

# ============================================
# Configuracion de niveles de logging
# ============================================
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.com.ondra.users=${LOG_LEVEL_APP}
logging.level.org.springframework.web=${LOG_LEVEL_WEB}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_BINDER}

# ============================================
# Configuracion de endpoints de monitoreo Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.db.enabled=true

# Informacion de la aplicacion expuesta por Actuator
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

info.app.name=ONDRA Contenidos Service
info.app.description=Microservicio de gestion de contenidos
info.app.version=1.0.0
info.app.encoding=UTF-8
info.app.java.version=17

# Porcentaje que recibe el artista por cada venta (80%)
app.cobro.porcentaje-artista=0.80

# Umbral de reproducciones para generar un cobro (cada 1000 plays)
app.cobro.reproducciones-umbral=1000

# Pago que recibe el artista por cada 1000 reproducciones
app.cobro.pago-por-mil-reproducciones=5.00